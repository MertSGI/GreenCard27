name: Render coach heartbeat
on:
  schedule:
    - cron: "3,13,23,33,43,53 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/render-heartbeat.yml"]

permissions:
  contents: read

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Wake Render and verify Telegram webhook
        run: |
          python - <<'PY'
          import json, time, urllib.request, os
          url="https://greencard27.onrender.com/health"
          for attempt in range(7):
              try:
                  with urllib.request.urlopen(url,timeout=100) as result:
                      data=json.loads(result.read(6000).decode("utf-8"))
                      assert data.get("telegram_transport")=="webhook",data
                      assert data.get("status")=="ok",data
                      deployed=data.get("deployed_sha","")
                      expected=os.environ.get("GITHUB_SHA","")
                      print("RENDER_DEPLOYED_SHA",deployed or "NOT_REPORTED")
                      if not deployed or deployed!=expected:
                          raise RuntimeError("Render has not deployed last verified source SHA yet")
                      print("RENDER_EXACT_SHA_HEALTH=PASS",data)
                      break
              except Exception as exc:
                  print("RENDER_HEALTH=RETRY",attempt+1,type(exc).__name__)
                  if attempt==6:
                      raise
                  time.sleep(20)
          PY
