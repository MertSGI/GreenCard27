name: GreenCard27 Python smoke
on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile Python
        run: python -m compileall -q greencard_telegram_bot.py render_runtime.py gemini_runtime.py web_research.py state_store.py coach_core.py tests
      - name: Offline webhook tests
        run: python -m unittest discover -s tests -v
